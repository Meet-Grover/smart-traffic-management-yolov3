<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Smart Traffic Management</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, system-ui, sans-serif; background:#0f1115; color:#eee; margin:0; padding:24px; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  p.sub { color:#9aa0a6; margin-top:0; }
  .grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(240px,1fr)); gap:16px; margin-top:24px; }
  .lane { background:#1b1e24; border-radius:12px; padding:16px; border:2px solid transparent; }
  .lane.active { border-color:#4caf50; box-shadow:0 0 0 3px rgba(76,175,80,.2); }
  .lane.active.active-emergency { border-color:#e53935; box-shadow:0 0 0 3px rgba(229,57,53,.3); }
  .lane.emergency-pending:not(.active) { border-color:#7a4a1f; border-style:dashed; }
  .badge.amber { background:#4a3a1f; color:#f2c28b; }
  .lane h3 { margin:0 0 8px; }
  .count { font-size: 32px; font-weight:600; }
  .badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:12px; margin-left:8px; }
  .badge.green { background:#1e4620; color:#7fd88a; }
  .badge.red { background:#4a1f1f; color:#f28b8b; }
  .preview { width:100%; height:110px; object-fit:cover; border-radius:8px; margin:8px 0; background:#111; display:none; }
  .samples { display:flex; gap:6px; flex-wrap:wrap; margin:8px 0; }
  .samples img { width:44px; height:44px; object-fit:cover; border-radius:6px; cursor:pointer; border:2px solid transparent; opacity:.85; transition:.15s; }
  .samples img:hover { opacity:1; transform:scale(1.05); }
  .samples img.selected { border-color:#4caf50; opacity:1; }
  .samples-label { font-size:11px; color:#9aa0a6; text-transform:uppercase; letter-spacing:.03em; margin-top:6px; }
  input[type=file] { margin-top:8px; font-size:12px; width:100%; }
  .status { margin-top:24px; padding:12px 16px; background:#1b1e24; border-radius:12px; }
  .loading { opacity:.5; }
  .progress-wrap { height:4px; background:#2a2e37; border-radius:2px; margin:8px 0 2px; overflow:hidden; display:none; }
  .progress-wrap.active { display:block; }
  .progress-bar { height:100%; width:0%; background:#4caf50; transition:width .2s linear; }
  .progress-text { font-size:11px; color:#9aa0a6; display:none; margin-bottom:6px; }
  .progress-text.active { display:block; }
</style>
</head>
<body>
  <h1>Smart Traffic Management System</h1>
  <p class="sub">Pick a sample image per lane, or upload your own — YOLOv8 detects vehicle density and emergency vehicles live.</p>

  <div class="grid" id="lanes"></div>

  <div class="status" id="status">Waiting for first detection…</div>
  <div class="status" id="countdown" style="display:none;"></div>

<script>
const LANE_NAMES = ["North", "East", "South", "West"];
// The page is now served BY this same FastAPI server (see backend/app/main.py's
// static mount), so API calls and the WebSocket are same-origin — no more
// file:// guesswork needed.
const API_BASE = "";

// Bundled sample images, shipped alongside this page (frontend/samples/).
const SAMPLES = [
  { file: "samples/traffic-1.jpg", label: "Traffic 1" },
  { file: "samples/traffic-2.jpg", label: "Traffic 2" },
  { file: "samples/traffic-3.jpg", label: "Traffic 3" },
  { file: "samples/traffic-4.jpg", label: "Traffic 4" },
  { file: "samples/ambulance-1.jpg", label: "Ambulance 1" },
  { file: "samples/ambulance-2.jpg", label: "Ambulance 2" },
  { file: "samples/ambulance-3.jpg", label: "Ambulance 3" },
];

const lanesEl = document.getElementById("lanes");
LANE_NAMES.forEach((name, i) => {
  const div = document.createElement("div");
  div.className = "lane";
  div.id = `lane-${i}`;

  const samplesHtml = SAMPLES.map((s, si) =>
    `<img src="${s.file}" title="${s.label}" data-lane="${i}" data-src="${s.file}" onclick="selectSample(${i}, '${s.file}', this)" />`
  ).join("");

  div.innerHTML = `
    <h3>${name} <span class="badge" id="badge-${i}"></span></h3>
    <img class="preview" id="preview-${i}" />
    <div class="progress-wrap" id="progress-wrap-${i}"><div class="progress-bar" id="progress-bar-${i}"></div></div>
    <div class="progress-text" id="progress-text-${i}"></div>
    <div class="count" id="count-${i}">–</div>
    <div style="font-size:12px;color:#9aa0a6;">vehicles detected</div>
    <div class="samples-label">Sample images</div>
    <div class="samples">${samplesHtml}</div>
    <div class="samples-label">Or upload your own</div>
    <input type="file" accept="image/*" onchange="uploadFile(${i}, this.files[0])" />
  `;
  lanesEl.appendChild(div);
});

function setPreview(laneId, src) {
  const img = document.getElementById(`preview-${laneId}`);
  img.src = src;
  img.style.display = "block";
}

async function selectSample(laneId, path, imgEl) {
  document.querySelectorAll(`.lane#lane-${laneId} .samples img`).forEach(el => el.classList.remove("selected"));
  imgEl.classList.add("selected");
  setPreview(laneId, path);

  // Note: we deliberately avoid fetch() on a file:// path here — Chrome
  // blocks fetching local files via fetch/XHR even though <img> loading
  // them works fine. Instead, draw the already-loaded <img> onto a
  // canvas and export that as a blob, which works regardless of origin.
  const blob = await imageElementToBlob(imgEl);
  await sendDetection(laneId, blob);
}

function imageElementToBlob(imgEl) {
  return new Promise((resolve, reject) => {
    const finish = () => {
      const canvas = document.createElement("canvas");
      canvas.width = imgEl.naturalWidth;
      canvas.height = imgEl.naturalHeight;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(imgEl, 0, 0);
      canvas.toBlob((blob) => blob ? resolve(blob) : reject(new Error("canvas export failed")), "image/jpeg", 0.92);
    };
    if (imgEl.complete && imgEl.naturalWidth > 0) finish();
    else imgEl.onload = finish;
  });
}

async function uploadFile(laneId, file) {
  if (!file) return;
  document.querySelectorAll(`.lane#lane-${laneId} .samples img`).forEach(el => el.classList.remove("selected"));
  setPreview(laneId, URL.createObjectURL(file));
  await sendDetection(laneId, file);
}

// The backend can't report real progress mid-request (it's one
// synchronous call), so instead we estimate: the very first detection
// call on a fresh server also downloads+loads the YOLOv8 weights, which
// takes far longer than every call after it. We animate the bar toward
// ~90% over that estimated duration, then snap to 100% when the real
// response lands, so the wait is at least legible even without exact
// progress data.
let modelWarmedUp = false;
const FIRST_RUN_ESTIMATE_MS = 20000; // model download + first inference
const WARM_RUN_ESTIMATE_MS = 1200;   // typical CPU inference for one image

async function sendDetection(laneId, blob) {
  const lane = document.getElementById(`lane-${laneId}`);
  const wrap = document.getElementById(`progress-wrap-${laneId}`);
  const bar = document.getElementById(`progress-bar-${laneId}`);
  const text = document.getElementById(`progress-text-${laneId}`);

  lane.classList.add("loading");
  wrap.classList.add("active");
  text.classList.add("active");

  const estimate = modelWarmedUp ? WARM_RUN_ESTIMATE_MS : FIRST_RUN_ESTIMATE_MS;
  const startedAt = performance.now();
  bar.style.width = "0%";
  text.textContent = modelWarmedUp
    ? "Detecting…"
    : "Detecting… (first run downloads the YOLOv8 model, ~15–20s)";

  const tick = setInterval(() => {
    const elapsed = performance.now() - startedAt;
    // Ease toward 90%, never claiming completion until the response lands.
    const pct = Math.min(90, (elapsed / estimate) * 90);
    bar.style.width = `${pct}%`;
    if (!modelWarmedUp) {
      const remaining = Math.max(0, Math.ceil((estimate - elapsed) / 1000));
      text.textContent = `Detecting… (first run downloads the YOLOv8 model, ~${remaining}s left)`;
    }
  }, 150);

  document.getElementById("status").textContent = "Detecting…";
  try {
    const form = new FormData();
    form.append("file", blob, "frame.jpg");
    const res = await fetch(`${API_BASE}/api/lanes/${laneId}/detect`, { method: "POST", body: form });
    if (!res.ok) throw new Error(`Server responded ${res.status}`);
    const data = await res.json();

    bar.style.width = "100%";
    text.textContent = "Done";
    modelWarmedUp = true;

    document.getElementById(`count-${laneId}`).textContent = data.vehicle_count;
    renderState(data.signal_state);
  } catch (err) {
    text.textContent = "Failed";
    bar.style.width = "0%";
    document.getElementById("status").textContent =
      `Error talking to backend at ${API_BASE} — is uvicorn running? (${err.message})`;
  } finally {
    clearInterval(tick);
    lane.classList.remove("loading");
    setTimeout(() => {
      wrap.classList.remove("active");
      text.classList.remove("active");
    }, 600);
  }
}

let countdownInterval = null;
let countdownRemaining = 0;

function renderState(state) {
  LANE_NAMES.forEach((_, i) => {
    const el = document.getElementById(`lane-${i}`);
    const isActive = i === state.active_lane;
    const isEmergencyPending = state.lanes[i].emergency; // still flagged, hasn't been served yet
    el.classList.toggle("active", isActive);
    el.classList.toggle("active-emergency", isActive && state.reason === "emergency_vehicle");
    el.classList.toggle("emergency-pending", isEmergencyPending);

    const badge = document.getElementById(`badge-${i}`);
    if (isEmergencyPending) {
      badge.textContent = isActive ? "EMERGENCY" : "EMERGENCY (waiting)";
      badge.className = "badge " + (isActive ? "red" : "amber");
    } else {
      badge.textContent = "";
      badge.className = "badge";
    }
  });

  document.getElementById("status").innerHTML =
    `Green: <b>${state.active_lane_name}</b> for <b>${state.green_seconds}s</b> — reason: ${state.reason}`;

  startCountdown(state.green_seconds);
}

function startCountdown(seconds) {
  clearInterval(countdownInterval);
  countdownRemaining = seconds;
  const el = document.getElementById("countdown");
  el.style.display = "block";
  renderCountdown();
  countdownInterval = setInterval(() => {
    countdownRemaining -= 1;
    if (countdownRemaining <= 0) {
      clearInterval(countdownInterval);
      el.textContent = "Advancing to the next lane…";
      advanceSignal();
    } else {
      renderCountdown();
    }
  }, 1000);
}

function renderCountdown() {
  document.getElementById("countdown").textContent = `${countdownRemaining}s remaining on this green`;
}

async function advanceSignal() {
  try {
    const res = await fetch(`${API_BASE}/api/advance`, { method: "POST" });
    if (!res.ok) throw new Error(`Server responded ${res.status}`);
    const state = await res.json();
    renderState(state);
  } catch (err) {
    document.getElementById("status").textContent = `Error advancing signal: ${err.message}`;
  }
}

// Live updates via WebSocket, in case another client updates state
try {
  const wsProtocol = window.location.protocol === "https:" ? "wss" : "ws";
  const ws = new WebSocket(`${wsProtocol}://${window.location.host}/ws`);
  ws.onmessage = (ev) => renderState(JSON.parse(ev.data));
} catch (e) { /* WebSocket optional; upload still works without it */ }
</script>
</body>
</html>
